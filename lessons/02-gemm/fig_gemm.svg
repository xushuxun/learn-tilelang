<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <!-- 网格底纹：一格 28×28，白线分隔 -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#DDE5F0" stroke="white" stroke-width="2"/>
    </pattern>
    <!-- 箭头 -->
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C06020"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F8F3F"/>
    </marker>
  </defs>

  <!-- A（M×K）：8 列 × 6 行，原点 (60,60)，格子 28 -->
  <rect x="60" y="60" width="224" height="168" fill="url(#grid)"/>
  <!-- 第 i 行（i=2）：y = 60 + 2*28 = 116 -->
  <rect x="60" y="116" width="224" height="28" fill="#F0A868" stroke="white" stroke-width="2"/>

  <!-- B（K×N）：5 列 × 8 行，原点 (400,40) -->
  <rect x="400" y="40" width="140" height="224" fill="url(#grid)"/>
  <!-- 第 j 列（j=3）：x = 400 + 3*28 = 484 -->
  <rect x="484" y="40" width="28" height="224" fill="#7FBF7F" stroke="white" stroke-width="2"/>

  <!-- C（M×N）：5 列 × 6 行，原点 (680,60)；高亮格 (i=2, j=3)：x=764, y=116 -->
  <rect x="680" y="60" width="140" height="168" fill="url(#grid)"/>
  <rect x="764" y="116" width="28" height="28" fill="#E8836B" stroke="white" stroke-width="2"/>

  <!-- A 第 i 行 -> C[i,j]：从 (284,130) 弧到格心 (778,130) -->
  <path d="M 284 130 C 480 70, 640 70, 774 126"
        fill="none" stroke="#C06020" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <!-- B 第 j 列 -> C[i,j]：从列底 (498,264) 弧到格底 (778,146) -->
  <path d="M 498 264 C 560 330, 720 280, 776 150"
        fill="none" stroke="#3F8F3F" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- 标注 -->
  <text x="172" y="48" text-anchor="middle" font-size="17">A（M×K）</text>
  <text x="50" y="136" text-anchor="end" font-size="15" fill="#C06020">第 i 行</text>
  <text x="470" y="28" text-anchor="middle" font-size="17">B（K×N）</text>
  <text x="478" y="290" text-anchor="end" font-size="15" fill="#3F8F3F">第 j 列</text>
  <text x="750" y="48" text-anchor="middle" font-size="17">C（M×N）</text>
  <text x="800" y="136" font-size="15" fill="#B04030">C[i, j]</text>

  <!-- 定义式 -->
  <text x="500" y="368" text-anchor="middle" font-size="17">
    C[i, j] = A 的第 i 行 · B 的第 j 列 = Σ A[i, k] × B[k, j]，k 从 0 到 K−1
  </text>
  <text x="500" y="398" text-anchor="middle" font-size="14" fill="#333333">
    C 有 M×N 个元素，每个元素 K 次乘加，总运算量 2×M×N×K FLOP
  </text>
</svg>
